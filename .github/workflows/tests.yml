name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q main.py services tools tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  runtime-smoke:
    name: AstrBot 4.28.2 runtime smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AstrBot runtime
        run: python -m pip install "AstrBot==4.28.2"

      - name: Fetch official Airi Gallery v2.11.15 source
        run: git clone --depth 1 https://github.com/Lidure/astrbot_plugin_airi_gallery.git .official-airi-gallery

      - name: Run route-guard runtime smoke
        run: python tests/runtime_smoke.py .official-airi-gallery
