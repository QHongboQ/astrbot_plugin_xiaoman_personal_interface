name: astrbot_plugin_xiaoman_personal_interface
display_name: 林小满个人接口
short_desc: 提供照片工具与由林小满自主规划的滚动生命日播报。
desc: |
  注册无参数 Function Tool `send_xiaoman_photo()`。
  仅在上层 LLM 已根据人格和上下文决定向当前聊天对象发送林小满的一张照片时调用。
  自然语言路由由正常 LLM 处理；显式图库浏览命令由 Airi Gallery 处理。
  TimeAwareness 仅提供只读时钟、日历、世界观与传感器上下文；林小满拥有从动态生活日边界到次日边界的独立规划器和持久化时间线。
  本插件不负责 TTS、人格、记忆、好感度或图片生成。
version: 0.9.0
author: QHongboQ
repo: https://github.com/QHongboQ/astrbot_plugin_xiaoman_personal_interface
astrbot_version: ">=4.28.2"
tags:
  - llm-tool
  - personal-interface
