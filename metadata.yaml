name: astrbot_plugin_xiaoman_personal_interface
display_name: 林小满个人接口
short_desc: 提供林小满照片能力与仅作用于 tts_speak 的 MiMo 语音适配。
desc: |
  注册无参数 Function Tool `send_xiaoman_photo()`，并仅在现有 `tts_speak` 工具实际调用前适配其文本参数。
  照片工具仅在上层 LLM 已根据人格和上下文决定向当前聊天对象发送林小满的一张照片时调用。
  本插件不负责 TTS 合成、人格、记忆、日程、好感度或图片生成。
version: 0.1.4
author: QHongboQ
repo: https://github.com/QHongboQ/astrbot_plugin_xiaoman_personal_interface
astrbot_version: ">=4.28.2"
tags:
  - llm-tool
  - personal-interface
